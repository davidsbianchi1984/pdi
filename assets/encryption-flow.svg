<svg role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Helvetica, Arial, sans-serif"><title id="t">PDI encryption flow — seal, store, audit</title><desc id="d">What happens to a value between the request and the disk. Generated by tools/build_assets.py.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#181235"/><stop offset="1" stop-color="#0c0920"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.34"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6a6399"/></marker></defs><rect width="1280" height="640" fill="url(#bg)"/><text x="86" y="76" font-size="30" fill="#f2effc" font-weight="800" text-anchor="start">Seal · store · audit</text><text x="86" y="106" font-size="14" fill="#9a93c6" font-weight="400" text-anchor="start">What happens to a value between the request and the disk — and what never happens.</text><rect x="86" y="164" width="258" height="158" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="86" y="164" width="4" height="158" rx="2" fill="#38bdf8"/><text x="106" y="194" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">1 · Resolve the key</text><text x="106" y="218" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">Deployment key, or the customer's</text><text x="106" y="238" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">own — presented per request and</text><text x="106" y="258" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">never stored.</text><path d="M350 243 L362 243" stroke="#6a6399" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><rect x="368" y="164" width="258" height="158" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="368" y="164" width="4" height="158" rx="2" fill="#7bc47f"/><text x="388" y="194" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">2 · Seal</text><text x="388" y="218" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">AES-256-GCM, with AAD bound to</text><text x="388" y="238" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">tenant + key so a blob cannot be</text><text x="388" y="258" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">moved between either.</text><path d="M632 243 L644 243" stroke="#6a6399" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><rect x="650" y="164" width="258" height="158" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="650" y="164" width="4" height="158" rx="2" fill="#7dd3fc"/><text x="670" y="194" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">3 · Store</text><text x="670" y="218" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">Only "&lt;version&gt;:nonce||ciphertext"</text><text x="670" y="238" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">reaches disk. The plaintext is not</text><text x="670" y="258" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">written anywhere.</text><path d="M914 243 L926 243" stroke="#6a6399" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><rect x="932" y="164" width="258" height="158" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="932" y="164" width="4" height="158" rx="2" fill="#ffb84d"/><text x="952" y="194" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">4 · Record</text><text x="952" y="218" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">The action lands on the chain —</text><text x="952" y="238" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">the key and the value do not.</text><text x="952" y="258" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">The chain proves, it does not hold.</text><rect x="86" y="380" width="1108" height="108" rx="16" fill="#181240" stroke="#e0687a" stroke-width="1.3"/><rect x="86" y="380" width="4" height="108" rx="2" fill="#e0687a"/><text x="108" y="412" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">What a wrong key does — before it does damage</text><text x="108" y="438" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">A presented key is checked against a stored check value first, so a wrong one is refused rather than used.</text><text x="108" y="458" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">Sealing under it would write records that nothing could ever open again — a silent, permanent loss.</text><text x="86" y="542" font-size="12.5" fill="#6a6399" font-weight="400" text-anchor="start">Rotation adds a key version and re-seals; retirement removes the old one only once nothing is left on it.</text><text x="86" y="566" font-size="12.5" fill="#6a6399" font-weight="400" text-anchor="start">Adoption of a customer key is all-or-nothing: a half-migrated tenant is the worst state to be in.</text></svg>