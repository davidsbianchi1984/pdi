h d="M898.3847763108503 338.3847763108502 L945.0538238691623 385.0538238691624" stroke="#302a60" stroke-width="7"/><path d="M861.6152236891497 338.3847763108502 L814.9461761308377 385.0538238691624" stroke="#302a60" stroke-width="7"/><path d="M861.6152236891497 301.6152236891498 L814.9461761308376 254.9461761308376" stroke="#302a60" stroke-width="7"/><path d="M898.3847763108503 301.6152236891498 L945.0538238691623 254.9461761308376" stroke="#302a60" stroke-width="7"/><circle cx="880" cy="320" r="34" fill="#0c0920" stroke="#7dd3fc" stroke-width="2"/><rect x="871" y="316" width="18" height="16" rx="3" fill="#7dd3fc"/><path d="M874 316 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke="#7dd3fc" stroke-width="2.4"/><text x="880" y="498" font-size="11.5" fill="#6a6399" font-weight="400" text-anchor="middle">n o n c e · a a d · t a g</text><rect x="86" y="230" width="330" height="96" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="86" y="230" width="4" height="96" rx="2" fill="#38bdf8"/><text x="106" y="260" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">Per-tenant isolation</text><text x="106" y="284" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">AAD binds ciphertext to tenant + key,</text><text x="106" y="304" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">so a record cannot be relocated.</text><rect x="86" y="344" width="330" height="96" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="86" y="344" width="4" height="96" rx="2" fill="#7bc47f"/><text x="106" y="374" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">Customer-held keys</text><text x="106" y="398" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">Under BYOK the operator's own</text><text x="106" y="418" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">database cannot open the records.</text><rect x="358.4" y="358" width="43.6" height="22" rx="11" fill="rgba(255,255,255,0.05)" stroke="#7bc47f" stroke-width="1"/><text x="380.2" y="373.5" font-size="10.5" fill="#7bc47f" font-weight="700" text-anchor="middle">BYOK</text><rect x="86" y="458" width="330" height="76" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="86" y="458" width="4" height="76" rx="2" fill="#ffb84d"/><text x="106" y="488" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">Compliance carriage</text><text x="106" y="512" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">HIPAA · OSHA · CPNI, with the BAA</text><text x="106" y="532" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">enforced in code before any PHI.</text><rect x="470.0" y="556" width="154.0" height="34" rx="8" fill="#181240" stroke="#7dd3fc" stroke-width="1.1"/><text x="547.0" y="578" font-size="11.5" fill="#9a93c6" font-weight="600" text-anchor="middle">genesis</text><path d="M626.0 573 L648.0 573" stroke="#7dd3fc" stroke-width="1.4" fill="none" marker-end="url(#ah)"/><rect x="650.0" y="556" width="154.0" height="34" rx="8" fill="#181240" stroke="#7dd3fc" stroke-width="1.1"/><text x="727.0" y="578" font-size="11.5" fill="#9a93c6" font-weight="600" text-anchor="middle">3f9a…</text><path d="M806.0 573 L828.0 573" stroke="#7dd3fc" stroke-width="1.4" fill="none" marker-end="url(#ah)"/><rect x="830.0" y="556" width="154.0" height="34" rx="8" fill="#181240" stroke="#7dd3fc" stroke-width="1.1"/><text x="907.0" y="578" font-size="11.5" fill="#9a93c6" font-weight="600" text-anchor="middle">b21c…</text><path d="M986.0 573 L1008.0 573" stroke="#7dd3fc" stroke-width="1.4" fill="none" marker-end="url(#ah)"/><rect x="1010.0" y="556" width="154.0" height="34" rx="8" fill="#181240" stroke="#7dd3fc" stroke-width="1.1"/><text x="1087.0" y="578" font-size="11.5" fill="#9a93c6" font-weight="600" text-anchor="middle">e07d…</text><text x="470" y="604" font-size="12" fill="#6a6399" font-weight="400" text-anchor="start">append-only, hash-chained — any retroactive edit breaks the link and GET /audit/verify says so</text></svg>