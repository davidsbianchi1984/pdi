<svg role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Helvetica, Arial, sans-serif"><title id="t">PDI architecture — tenants, encrypted vault, tamper-evident audit</title><desc id="d">How a record enters, who can read it, and what proves it was not edited. Generated by tools/build_assets.py.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#181235"/><stop offset="1" stop-color="#0c0920"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.34"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6a6399"/></marker></defs><rect width="1280" height="640" fill="url(#bg)"/><text x="86" y="76" font-size="30" fill="#f2effc" font-weight="800" text-anchor="start">PDI architecture</text><text x="86" y="106" font-size="14" fill="#9a93c6" font-weight="400" text-anchor="start">Every record arrives through a tenant, leaves as ciphertext, and lands on the chain.</text><rect x="86" y="164" width="257" height="158" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="86" y="164" width="4" height="158" rx="2" fill="#38bdf8"/><text x="106" y="194" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">Integrating systems</text><text x="106" y="218" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">qrme — profile source material</text><text x="106" y="238" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">jim-mini — medical &amp; context</text><text x="106" y="258" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">robots — what a body recorded</text><text x="106" y="278" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start"></text><text x="106" y="298" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">each its own tenant + token</text><path d="M347 243 L365 243" stroke="#6a6399" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><rect x="369" y="164" width="257" height="158" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="369" y="164" width="4" height="158" rx="2" fill="#7bc47f"/><text x="389" y="194" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">The vault</text><text x="389" y="218" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">AES-256-GCM at rest</text><text x="389" y="238" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">AAD-bound to tenant + key</text><text x="389" y="258" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">envelope keys, rotatable</text><text x="389" y="278" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start"></text><text x="389" y="298" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">only ciphertext on disk</text><path d="M630 243 L648 243" stroke="#6a6399" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><rect x="652" y="164" width="257" height="158" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="652" y="164" width="4" height="158" rx="2" fill="#ffb84d"/><text x="672" y="194" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">The audit chain</text><text x="672" y="218" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">every put / get / delete</text><text x="672" y="238" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">SHA-256 over the previous hash</text><text x="672" y="258" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">verify() walks the whole chain</text><text x="672" y="278" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start"></text><text x="672" y="298" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">append-only, kept forever</text><path d="M913 243 L931 243" stroke="#6a6399" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><rect x="935" y="164" width="257" height="158" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="935" y="164" width="4" height="158" rx="2" fill="#e0687a"/><text x="955" y="194" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">Physical custody</text><text x="955" y="218" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">beacons on carriers and gates</text><text x="955" y="238" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">a scan is a link in the chain</text><text x="955" y="258" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">the agent may never grant entry</text><text x="955" y="278" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start"></text><text x="955" y="298" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">reveals a seal, not contents</text><rect x="1140.8" y="178" width="37.2" height="22" rx="11" fill="rgba(255,255,255,0.05)" stroke="#e0687a" stroke-width="1"/><text x="1159.4" y="193.5" font-size="10.5" fill="#e0687a" font-weight="700" text-anchor="middle">NEW</text><rect x="86" y="372" width="1108" height="96" rx="16" fill="#181240" stroke="#302a60" stroke-width="1.2"/><rect x="86" y="372" width="4" height="96" rx="2" fill="#7dd3fc"/><text x="108" y="402" font-size="15" fill="#f2effc" font-weight="700" text-anchor="start">The question that decides everything: who holds the key</text><text x="108" y="428" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">Under deployment custody the operator can decrypt. Under BYOK they cannot — and the same rack, the same</text><text x="108" y="448" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">colocation contract and the same audit chain look identical from outside. It is not whose rack it is.</text><rect x="86.0" y="508" width="149.0" height="34" rx="8" fill="#181240" stroke="#ffb84d" stroke-width="1.1"/><text x="160.5" y="530" font-size="11.5" fill="#9a93c6" font-weight="600" text-anchor="middle">genesis</text><path d="M237.0 525 L259.0 525" stroke="#ffb84d" stroke-width="1.4" fill="none" marker-end="url(#ah)"/><rect x="261.0" y="508" width="149.0" height="34" rx="8" fill="#181240" stroke="#ffb84d" stroke-width="1.1"/><text x="335.5" y="530" font-size="11.5" fill="#9a93c6" font-weight="600" text-anchor="middle">3f9a…</text><path d="M412.0 525 L434.0 525" stroke="#ffb84d" stroke-width="1.4" fill="none" marker-end="url(#ah)"/><rect x="436.0" y="508" width="149.0" height="34" rx="8" fill="#181240" stroke="#ffb84d" stroke-width="1.1"/><text x="510.5" y="530" font-size="11.5" fill="#9a93c6" font-weight="600" text-anchor="middle">b21c…</text><path d="M587.0 525 L609.0 525" stroke="#ffb84d" stroke-width="1.4" fill="none" marker-end="url(#ah)"/><rect x="611.0" y="508" width="149.0" height="34" rx="8" fill="#181240" stroke="#ffb84d" stroke-width="1.1"/><text x="685.5" y="530" font-size="11.5" fill="#9a93c6" font-weight="600" text-anchor="middle">e07d…</text><text x="86" y="566" font-size="12.5" fill="#6a6399" font-weight="400" text-anchor="start">A physical carrier gets a beacon: its scans and hand-ins land on this same chain, so a gap in custody becomes a finding.</text></svg>