name: CI

# When this fires is as much a part of the check as what it runs.
#
# It used to be `push` restricted to `main` plus `pull_request`. Releases here
# are fast-forward merges, so no pull request is ever opened, and a push to
# `main` happens *after* the decision to ship. Both halves of that trigger
# therefore ran only where the answer could no longer change anything. This
# workflow happens to have been green throughout; QRME's, on the same trigger,
# was red for twenty-nine consecutive runs and `native.yml` for a hundred and
# twenty-three, and nothing noticed either. Green under a blind trigger is
# luck, not evidence.
#
# Any branch push now. A check that cannot fail before the merge is not a
# check, it is a record.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q

  # Smoke-test the front-end: every PR proves the desktop app still type-checks
  # and builds. (Skips the Electron binary download — the renderer build does
  # not need it.)
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
