# XcodeGen spec — generates PdiVault.xcodeproj.
#   brew install xcodegen && xcodegen generate && open PdiVault.xcodeproj
name: PdiVault
options:
  bundleIdPrefix: com.pdi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  PdiVault:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdi.vault
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: "1004001"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    # A generated Info.plist and an `info:` block are mutually exclusive:
    # GENERATE_INFOPLIST_FILE takes scalar INFOPLIST_KEY_* settings only, and
    # NSAppTransportSecurity is a dictionary. So the plist is written here —
    # and `path` is required, which is what the spec was missing.
    #
    # Kept outside Sources/ so XcodeGen does not also sweep the file it just
    # generated into the target as a resource.
    info:
      path: PdiVault-Info.plist
      properties:
        CFBundleDisplayName: PDI Vault
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow http://127.0.0.1:8000 in the Simulator (local dev backend).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
